name: Build bunnylock

on:
  push:
    branches: [ main ]
  workflow_dispatch: # 允许你在 Actions 页面手动点击运行

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. 配置 Java 环境 (Gradle 运行用)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 2. 配置 Android SDK (修复了 tools 包找不到的报错)
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # 3. 安装作者指定的 NDK (29.0.14206865) 和 CMake (3.22.1)
      # 加了 yes | 确保自动同意协议，不会卡住
      - name: Install NDK and CMake
        run: |
          yes | sdkmanager "ndk;29.0.14206865"
          yes | sdkmanager "cmake;3.22.1"

      # 4. 赋予执行权限
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 5. 编译 Release APK
      # 源码没有配置 keystore，会自动用 debug 签名，能直接安装
      - name: Build Release APK
        run: ./gradlew assembleRelease

      # 6. 上传生成的 APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bunnylock-release
          path: app/build/outputs/apk/release/*.apk